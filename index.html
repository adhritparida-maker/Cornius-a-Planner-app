<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="Logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conrius Planner app</title>
<style>
  :root {
    --bg: #EEF0F4;
    --surface: #FFFFFF;
    --surface-2: #F6F7FA;
    --text: #1B1E2B;
    --text-2: #5B5F72;
    --text-3: #8A8EA0;
    --border: #DBDFEA;
    --border-soft: #E7E9F1;
    --accent: #3B4B8C;
    --accent-strong: #2C3A70;
    --accent-soft: #E4E8F7;
    --activity: #2E6B8F;
    --activity-soft: #DEEBF3;
    --goal: #B4761F;
    --goal-soft: #F5E7D3;
    --task: #3F8F6D;
    --task-soft: #DFF0E8;
    --danger: #B24A4A;
    --shadow: 0 12px 32px -12px rgba(30, 34, 54, 0.22);
    --shadow-sm: 0 2px 8px -2px rgba(30, 34, 54, 0.14);
    --radius: 10px;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'Cascadia Mono', Consolas, 'Roboto Mono', monospace;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12131A;
      --surface: #1B1D28;
      --surface-2: #21232F;
      --text: #E8E8EF;
      --text-2: #A3A6B8;
      --text-3: #71748A;
      --border: #2E3040;
      --border-soft: #262836;
      --accent: #8A9AE8;
      --accent-strong: #A6B4F0;
      --accent-soft: #262B45;
      --activity: #6FB6DE;
      --activity-soft: #1E2E3A;
      --goal: #E0AE63;
      --goal-soft: #362B1C;
      --task: #74C89E;
      --task-soft: #1B3129;
      --danger: #E08585;
      --shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.55);
      --shadow-sm: 0 2px 10px -2px rgba(0, 0, 0, 0.4);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12131A;
    --surface: #1B1D28;
    --surface-2: #21232F;
    --text: #E8E8EF;
    --text-2: #A3A6B8;
    --text-3: #71748A;
    --border: #2E3040;
    --border-soft: #262836;
    --accent: #8A9AE8;
    --accent-strong: #A6B4F0;
    --accent-soft: #262B45;
    --activity: #6FB6DE;
    --activity-soft: #1E2E3A;
    --goal: #E0AE63;
    --goal-soft: #362B1C;
    --task: #74C89E;
    --task-soft: #1B3129;
    --danger: #E08585;
    --shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.55);
    --shadow-sm: 0 2px 10px -2px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #EEF0F4;
    --surface: #FFFFFF;
    --surface-2: #F6F7FA;
    --text: #1B1E2B;
    --text-2: #5B5F72;
    --text-3: #8A8EA0;
    --border: #DBDFEA;
    --border-soft: #E7E9F1;
    --accent: #3B4B8C;
    --accent-strong: #2C3A70;
    --accent-soft: #E4E8F7;
    --activity: #2E6B8F;
    --activity-soft: #DEEBF3;
    --goal: #B4761F;
    --goal-soft: #F5E7D3;
    --task: #3F8F6D;
    --task-soft: #DFF0E8;
    --danger: #B24A4A;
    --shadow: 0 12px 32px -12px rgba(30, 34, 54, 0.22);
    --shadow-sm: 0 2px 8px -2px rgba(30, 34, 54, 0.14);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font-family: inherit; }
  ::selection { background: var(--accent-soft); }

  @media (prefers-reduced-motion: no-preference) {
    .day-cell, .chip, .modal, .panel, .modal-overlay, .theme-toggle .knob, button {
      transition: background-color .15s ease, border-color .15s ease, transform .12s ease, box-shadow .15s ease, opacity .15s ease;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .layout {
    display: flex;
    align-items: flex-start;
    min-height: 100%;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    height: 100vh;
    position: sticky;
    top: 0;
    overflow-y: auto;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px 16px 40px;
  }
  .sidebar-title {
    font-family: var(--font-display);
    font-size: 1.05rem;
    font-weight: 400;
    margin: 0 4px 16px;
    color: var(--text);
  }
  .sidebar .panel-section { padding: 0 4px; }
  .sidebar h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-3);
    margin: 18px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar h3:first-child { margin-top: 0; }
  .sidebar h3 .add-inline {
    font-size: 0.72rem;
    text-transform: none;
    letter-spacing: 0;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .sidebar .list-item { gap: 7px; }
  .sidebar-date {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    color: var(--text-3);
    flex-shrink: 0;
  }

  .app {
    flex: 1;
    min-width: 0;
    max-width: 1160px;
    margin: 0 auto;
    padding: 28px 24px 64px;
    min-height: 100%;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand svg { display: block; }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.65rem;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .brand .tag {
    font-size: 0.72rem;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.11em;
    margin-top: 1px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 0.86rem;
    cursor: pointer;
    line-height: 1.2;
  }
  .btn:hover { border-color: var(--text-3); }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--text-2);
  }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { color: var(--danger); border-color: var(--border); background: var(--surface); }
  .btn-danger:hover { background: var(--surface-2); border-color: var(--danger); }
  .btn-sm { padding: 5px 10px; font-size: 0.78rem; }
  .btn[data-kind="activity"] { border-color: var(--activity); color: var(--activity); }
  .btn[data-kind="goal"] { border-color: var(--goal); color: var(--goal); }
  .btn[data-kind="task"] { border-color: var(--task); color: var(--task); }

  .theme-toggle {
    width: 46px;
    height: 26px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .theme-toggle .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  :root[data-theme="dark"] .theme-toggle .knob { left: 22px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .knob { left: 22px; }
  }

  /* ---------- Month nav ---------- */
  .month-bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .month-title {
    font-family: var(--font-display);
    font-size: 1.7rem;
    font-variant-numeric: tabular-nums;
  }
  .month-nav { display: flex; align-items: center; gap: 6px; }
  .nav-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: var(--surface-2); color: var(--text); }

  /* ---------- Calendar grid ---------- */
  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }
  .weekday-row div {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-3);
    text-align: left;
    padding-left: 4px;
  }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: minmax(96px, auto);
    gap: 6px;
  }
  .day-cell {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 6px 6px 8px;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    color: var(--text);
    font-family: inherit;
  }
  .day-cell:hover { border-color: var(--text-3); box-shadow: var(--shadow-sm); }
  .day-cell.dim { color: var(--text-3); background: var(--surface-2); }
  .day-cell.dim .date-num { color: var(--text-3); }
  .day-cell.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .date-num {
    font-variant-numeric: tabular-nums;
    font-size: 0.86rem;
    font-weight: 600;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
  }
  .day-cell.today .date-num { background: var(--accent); color: #fff; }
  .cell-chips { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .chip {
    display: flex; align-items: center; gap: 4px;
    font-size: 0.72rem;
    padding: 2px 5px;
    border-radius: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .chip .t { overflow: hidden; text-overflow: ellipsis; }
  .chip.activity { background: var(--activity-soft); color: var(--activity); }
  .chip.goal { background: var(--goal-soft); color: var(--goal); }
  .chip.task { background: var(--task-soft); color: var(--task); }
  .chip.task.done { text-decoration: line-through; opacity: 0.6; }
  .chip time { font-family: var(--font-mono); font-size: 0.68rem; flex-shrink: 0; }
  .more-link { font-size: 0.7rem; color: var(--text-3); padding: 1px 5px; }

  /* ---------- Day panel ---------- */
  .scrim {
    position: fixed; inset: 0;
    background: rgba(15, 16, 22, 0.38);
    opacity: 0; pointer-events: none;
    z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }

  .panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 420px;
    max-width: 92vw;
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow);
    transform: translateX(100%);
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel.open { transform: translateX(0); }
  .panel-head {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .panel-head h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.3rem;
    margin: 0 0 2px;
  }
  .panel-head .sub { font-size: 0.78rem; color: var(--text-3); }
  .panel-close {
    border: none; background: transparent; color: var(--text-2);
    font-size: 1.1rem; cursor: pointer; line-height: 1; padding: 4px;
  }
  .panel-close:hover { color: var(--text); }
  .panel-quickadd { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border-soft); }
  .panel-body { overflow-y: auto; flex: 1; padding: 4px 0 20px; }

  .timeline {
    position: relative;
    margin: 10px 20px 22px;
    border-top: 1px solid var(--border-soft);
  }
  .hour-row {
    position: relative;
    height: 44px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    cursor: pointer;
  }
  .hour-row:hover { background: var(--surface-2); }
  .hour-label {
    width: 52px;
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-3);
    padding-top: 2px;
    text-align: right;
    padding-right: 8px;
    user-select: none;
  }
  .timeline-events {
    position: absolute;
    top: 0; left: 60px; right: 8px; bottom: 0;
    pointer-events: none;
  }
  .tl-event {
    position: absolute;
    background: var(--activity-soft);
    border-left: 3px solid var(--activity);
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 0.72rem;
    color: var(--activity);
    overflow: hidden;
    pointer-events: auto;
    cursor: pointer;
  }
  .tl-event strong { display: block; font-size: 0.74rem; color: var(--text); font-weight: 600; }
  .tl-event span.time { font-family: var(--font-mono); font-size: 0.65rem; opacity: 0.85; }

  .panel-section { padding: 4px 20px 18px; }
  .panel-section h3 {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-3);
    margin: 14px 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-section h3 .add-inline {
    font-size: 0.72rem;
    text-transform: none;
    letter-spacing: 0;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .list-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .list-item:hover { background: var(--surface-2); }
  .list-item .swatch { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .list-item.goal .swatch { background: var(--goal); }
  .list-item .diff { font-size: 0.78rem; letter-spacing: -1px; flex-shrink: 0; }
  .list-item .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item .title.done { text-decoration: line-through; color: var(--text-3); }
  .list-item input[type="checkbox"] { accent-color: var(--task); width: 15px; height: 15px; flex-shrink: 0; }
  .empty-note { font-size: 0.8rem; color: var(--text-3); padding: 4px 9px 2px; font-style: italic; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15, 16, 22, 0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    opacity: 0; pointer-events: none;
    padding: 20px;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface);
    border-radius: 14px;
    width: 380px;
    max-width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow);
    padding: 22px 22px 18px;
    transform: translateY(8px);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 1.25rem;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-3);
  }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  input[type="text"], input[type="date"], input[type="time"], textarea {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
    font-size: 0.9rem;
    color: var(--text);
    font-family: inherit;
    width: 100%;
  }
  input[type="date"], input[type="time"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; accent-color: var(--accent); }
  textarea { resize: vertical; min-height: 56px; font-family: inherit; }

  .diff-picker { display: flex; gap: 6px; }
  .diff-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 8px 2px 6px;
    text-align: center;
    cursor: pointer;
    font-size: 0.82rem;
  }
  .diff-btn .flames { display: block; font-size: 0.72rem; letter-spacing: -2px; margin-bottom: 2px; }
  .diff-btn .lbl { display: block; font-size: 0.62rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .diff-btn.active { border-color: var(--goal); background: var(--goal-soft); }
  .diff-btn.active .lbl { color: var(--goal); }

  .modal-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border-soft);
  }
  .modal-footer .right { display: flex; gap: 8px; margin-left: auto; }

  .required-hint { color: var(--danger); font-size: 0.72rem; margin-top: -8px; margin-bottom: 10px; display: none; }
  .required-hint.show { display: block; }

  /* ---------- Timer ---------- */
  .timer-widget {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 12px 14px;
    display: none;
    align-items: center;
    gap: 12px;
    z-index: 80;
    min-width: 200px;
  }
  .timer-widget.show { display: flex; }
  .timer-widget.ringing { border-color: var(--goal); box-shadow: 0 0 0 3px var(--goal-soft); }
  .timer-widget .tw-info { flex: 1; min-width: 0; }
  .timer-widget .tw-phase {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
  }
  .timer-widget .tw-time {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    font-variant-numeric: tabular-nums;
  }
  .timer-widget .tw-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .timer-widget .tw-btn {
    border: none;
    background: var(--surface-2);
    color: var(--text-2);
    width: 28px; height: 28px;
    border-radius: 7px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.82rem;
    padding: 0;
  }
  .timer-widget .tw-btn:hover { background: var(--accent-soft); color: var(--accent); }

  @media (max-width: 880px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%;
      height: auto;
      max-height: 240px;
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
  }

  @media (max-width: 640px) {
    .app { padding: 18px 14px 48px; }
    .month-grid { grid-auto-rows: minmax(70px, auto); }
    .day-cell { padding: 4px 4px 6px; }
    .chip .t { display: none; }
    .chip time { display: none; }
    .chip { justify-content: center; padding: 3px; }
    .panel { width: 100%; max-width: 100%; }
    .timer-widget { left: 14px; right: 14px; width: auto; }
  }
</style>
</head>
<body>

<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">Goals &amp; Tasks</div>
  <div class="panel-section">
    <h3>Goals <button class="add-inline" id="sidebarAddGoal">+ add</button></h3>
    <div id="sidebarGoalList"></div>
    <h3>Tasks <button class="add-inline" id="sidebarAddTask">+ add</button></h3>
    <div id="sidebarTaskList"></div>
  </div>
</aside>

<div class="app">
  <header class="header">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <circle cx="15" cy="15" r="12.5" stroke="var(--accent)" stroke-width="1.4"/>
        <path d="M15 2.5V6M15 24V27.5M2.5 15H6M24 15H27.5" stroke="var(--accent)" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="15" cy="15" r="3.4" fill="var(--accent)"/>
      </svg>
      <div>
        <h1>Conrius</h1>
        <div class="tag">plans &amp; goals</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" data-kind="activity" id="addActivityBtn">+ Activity</button>
      <button class="btn" data-kind="goal" id="addGoalBtn">+ Goal</button>
      <button class="btn" data-kind="task" id="addTaskBtn">+ Task</button>
      <button class="btn" id="timerBtn">⏱ Timer</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle light / dark mode">
        <span class="knob" id="themeKnob">☀</span>
      </button>
    </div>
  </header>

  <div class="month-bar">
    <div class="month-title" id="monthTitle">August 2026</div>
    <div class="month-nav">
      <button class="btn btn-sm" id="todayBtn">Today</button>
      <button class="nav-btn" id="prevMonth" aria-label="Previous month">‹</button>
      <button class="nav-btn" id="nextMonth" aria-label="Next month">›</button>
    </div>
  </div>

  <div class="weekday-row">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div class="month-grid" id="monthGrid"></div>
</div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="dayPanel" aria-hidden="true">
  <div class="panel-head">
    <div>
      <h2 id="panelDate">—</h2>
      <div class="sub" id="panelSub"></div>
    </div>
    <button class="panel-close" id="panelClose" aria-label="Close">✕</button>
  </div>
  <div class="panel-quickadd">
    <button class="btn btn-sm" data-kind="activity" id="panelAddActivity">+ Activity</button>
    <button class="btn btn-sm" data-kind="goal" id="panelAddGoal">+ Goal</button>
    <button class="btn btn-sm" data-kind="task" id="panelAddTask">+ Task</button>
  </div>
  <div class="panel-body">
    <div class="timeline" id="timeline"></div>
    <div class="panel-section">
      <h3>Goals <button class="add-inline" data-add="goal">+ add</button></h3>
      <div id="goalList"></div>
      <h3>Tasks <button class="add-inline" data-add="task">+ add</button></h3>
      <div id="taskList"></div>
    </div>
  </div>
</aside>

<div class="modal-overlay" id="modalOverlay">
  <form class="modal" id="modalForm">
    <h2 id="modalTitle">Add activity</h2>
    <div id="modalFields"></div>
    <div class="required-hint" id="requiredHint">Please fill in the required fields.</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;">Delete</button>
      <div class="right">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  </form>
</div>

<div class="modal-overlay" id="timerOverlay">
  <div class="modal">
    <h2>Focus timer</h2>
    <div class="field-row">
      <div class="field">
        <label for="timerMinutes">Focus (minutes)</label>
        <input type="number" id="timerMinutes" min="1" max="180" value="25">
      </div>
      <div class="field">
        <label for="timerBreakMinutes">Break (minutes, optional)</label>
        <input type="number" id="timerBreakMinutes" min="0" max="60" value="5">
      </div>
    </div>
    <div class="modal-footer">
      <div class="right">
        <button type="button" class="btn btn-ghost" id="timerCancelBtn">Cancel</button>
        <button type="button" class="btn btn-primary" id="timerStartBtn">Start</button>
      </div>
    </div>
  </div>
</div>

<div class="timer-widget" id="timerWidget">
  <div class="tw-info">
    <div class="tw-phase" id="twPhase">Focus</div>
    <div class="tw-time" id="twTime">25:00</div>
  </div>
  <div class="tw-actions">
    <button type="button" class="tw-btn" id="twPauseBtn" title="Pause">⏸</button>
    <button type="button" class="tw-btn" id="twStopBtn" title="Stop">✕</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------------- data ---------------- */
  var STORE_KEY = "daybook.data.v1";
  var THEME_KEY = "daybook.theme";

  function loadData() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { activities: [], goals: [], tasks: [] };
  }
  function saveData() { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

  var data = loadData();
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  var DIFF = [
    null,
    { level: 1, flames: "🔥", label: "Easy" },
    { level: 2, flames: "🔥🔥", label: "Light" },
    { level: 3, flames: "🔥🔥🔥", label: "Moderate" },
    { level: 4, flames: "🔥🔥🔥🔥", label: "Hard" },
    { level: 5, flames: "🔥🔥🔥🔥🔥", label: "Extreme" }
  ];

  var WEEKDAY_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTH_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var MONTH_SHORT = MONTH_LONG.map(function (m) { return m.slice(0, 3); });

  /* ---------------- date helpers ---------------- */
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function iso(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
  function todayISO() { var t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); }
  function parseISO(s) { var p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function shortDate(iso_) { var dt = parseISO(iso_); return MONTH_SHORT[dt.getMonth()] + " " + dt.getDate(); }

  function to12h(hhmm) {
    if (!hhmm) return "";
    var p = hhmm.split(":");
    var h = parseInt(p[0], 10), m = p[1];
    var ap = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + ap;
  }

  /* ---------------- state ---------------- */
  var today = new Date();
  var viewYear = today.getFullYear();
  var viewMonth = today.getMonth();
  var selectedDate = null; // iso string
  var editing = null; // { type, id }

  /* ---------------- theme ---------------- */
  function systemPrefersDark() { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function currentThemeIsDark() {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === "dark") return true;
    if (saved === "light") return false;
    return systemPrefersDark();
  }
  function applyThemeIcon() {
    document.getElementById("themeKnob").textContent = currentThemeIsDark() ? "☾" : "☀";
  }
  function initTheme() {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    applyThemeIcon();
  }
  document.getElementById("themeToggle").addEventListener("click", function () {
    var next = currentThemeIsDark() ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    document.documentElement.setAttribute("data-theme", next);
    applyThemeIcon();
  });

  /* ---------------- item lookups ---------------- */
  function itemsForDate(iso_) {
    return {
      activities: data.activities.filter(function (a) { return a.date === iso_; }).sort(function (a, b) { return a.time.localeCompare(b.time); }),
      goals: data.goals.filter(function (g) { return g.date === iso_; }),
      tasks: data.tasks.filter(function (t) { return t.date === iso_; }).sort(function (a, b) { return (a.time || "").localeCompare(b.time || ""); })
    };
  }

  /* ---------------- render: month grid ---------------- */
  function renderMonth() {
    document.getElementById("monthTitle").textContent = MONTH_LONG[viewMonth] + " " + viewYear;
    var grid = document.getElementById("monthGrid");
    grid.innerHTML = "";

    var firstDow = new Date(viewYear, viewMonth, 1).getDay();
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    var daysInPrev = new Date(viewYear, viewMonth, 0).getDate();
    var totalCells = Math.ceil((firstDow + daysInMonth) / 7) * 7;
    var tISO = todayISO();

    for (var i = 0; i < totalCells; i++) {
      var dayNum, cellY = viewYear, cellM = viewMonth, dim = false;
      if (i < firstDow) {
        dayNum = daysInPrev - firstDow + 1 + i;
        cellM = viewMonth - 1; dim = true;
      } else if (i >= firstDow + daysInMonth) {
        dayNum = i - firstDow - daysInMonth + 1;
        cellM = viewMonth + 1; dim = true;
      } else {
        dayNum = i - firstDow + 1;
      }
      var normDate = new Date(cellY, cellM, dayNum);
      var cellISO = iso(normDate.getFullYear(), normDate.getMonth(), normDate.getDate());

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "day-cell" + (dim ? " dim" : "") + (cellISO === tISO ? " today" : "") + (cellISO === selectedDate ? " selected" : "");
      btn.setAttribute("data-date", cellISO);

      var numEl = document.createElement("div");
      numEl.className = "date-num";
      numEl.textContent = dayNum;
      btn.appendChild(numEl);

      var chipsWrap = document.createElement("div");
      chipsWrap.className = "cell-chips";
      var items = itemsForDate(cellISO);
      var combined = [];
      items.activities.forEach(function (a) { combined.push({ kind: "activity", data: a }); });
      items.tasks.forEach(function (t) { combined.push({ kind: "task", data: t }); });
      items.goals.forEach(function (g) { combined.push({ kind: "goal", data: g }); });

      var shown = combined.slice(0, 3);
      shown.forEach(function (it) {
        var chip = document.createElement("div");
        if (it.kind === "activity") {
          chip.className = "chip activity";
          chip.innerHTML = '<time>' + to12h(it.data.time).replace(" ", "") + '</time><span class="t">' + escapeHTML(it.data.title) + '</span>';
        } else if (it.kind === "task") {
          chip.className = "chip task" + (it.data.done ? " done" : "");
          chip.innerHTML = '<span>' + (it.data.done ? "✓" : "○") + '</span><span class="t">' + escapeHTML(it.data.title) + '</span>';
        } else {
          chip.className = "chip goal";
          chip.innerHTML = '<span>' + Array.from(DIFF[it.data.difficulty].flames)[0] + '</span><span class="t">' + escapeHTML(it.data.title) + '</span>';
        }
        chipsWrap.appendChild(chip);
      });
      if (combined.length > 3) {
        var more = document.createElement("div");
        more.className = "more-link";
        more.textContent = "+" + (combined.length - 3) + " more";
        chipsWrap.appendChild(more);
      }
      btn.appendChild(chipsWrap);

      btn.addEventListener("click", function () {
        var d = this.getAttribute("data-date");
        var dt = parseISO(d);
        if (dt.getMonth() !== viewMonth || dt.getFullYear() !== viewYear) {
          viewYear = dt.getFullYear(); viewMonth = dt.getMonth();
          renderMonth();
        }
        openDayPanel(d);
      });

      grid.appendChild(btn);
    }
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------------- sidebar ---------------- */
  function renderSidebar() {
    var goalListEl = document.getElementById("sidebarGoalList");
    var taskListEl = document.getElementById("sidebarTaskList");
    goalListEl.innerHTML = "";
    taskListEl.innerHTML = "";

    var goals = data.goals.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (goals.length === 0) {
      goalListEl.innerHTML = '<div class="empty-note">No goals yet.</div>';
    }
    goals.forEach(function (g) {
      var row = document.createElement("div");
      row.className = "list-item goal";
      row.innerHTML = '<span class="diff">' + DIFF[g.difficulty].flames + '</span><span class="title">' + escapeHTML(g.title) + '</span><span class="sidebar-date">' + shortDate(g.date) + '</span>';
      row.addEventListener("click", function () { openModal("goal", g.id); });
      goalListEl.appendChild(row);
    });

    var tasks = data.tasks.slice().sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      return a.date.localeCompare(b.date);
    });
    if (tasks.length === 0) {
      taskListEl.innerHTML = '<div class="empty-note">No tasks yet.</div>';
    }
    tasks.forEach(function (t) {
      var row = document.createElement("div");
      row.className = "list-item task";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!t.done;
      cb.addEventListener("click", function (e) {
        e.stopPropagation();
        t.done = cb.checked;
        saveData();
        renderSidebar();
        renderMonth();
        if (selectedDate) renderDayPanel();
      });
      row.appendChild(cb);
      var titleSpan = document.createElement("span");
      titleSpan.className = "title" + (t.done ? " done" : "");
      titleSpan.textContent = t.title;
      row.appendChild(titleSpan);
      var dateSpan = document.createElement("span");
      dateSpan.className = "sidebar-date";
      dateSpan.textContent = shortDate(t.date);
      row.appendChild(dateSpan);
      row.addEventListener("click", function () { openModal("task", t.id); });
      taskListEl.appendChild(row);
    });
  }

  document.getElementById("sidebarAddGoal").addEventListener("click", function () { openModal("goal", null, { date: selectedDate || todayISO() }); });
  document.getElementById("sidebarAddTask").addEventListener("click", function () { openModal("task", null, { date: selectedDate || todayISO() }); });

  /* ---------------- day panel ---------------- */
  var HOUR_START = 6, HOUR_END = 23; // 6am .. 11pm inclusive
  var ROW_H = 44;

  function openDayPanel(iso_) {
    selectedDate = iso_;
    renderMonth();
    renderDayPanel();
    document.getElementById("dayPanel").classList.add("open");
    document.getElementById("dayPanel").setAttribute("aria-hidden", "false");
    document.getElementById("scrim").classList.add("open");
  }
  function closeDayPanel() {
    document.getElementById("dayPanel").classList.remove("open");
    document.getElementById("dayPanel").setAttribute("aria-hidden", "true");
    document.getElementById("scrim").classList.remove("open");
    selectedDate = null;
    renderMonth();
  }

  function renderDayPanel() {
    if (!selectedDate) return;
    var dt = parseISO(selectedDate);
    document.getElementById("panelDate").textContent = WEEKDAY_LONG[dt.getDay()] + ", " + MONTH_LONG[dt.getMonth()] + " " + dt.getDate();
    document.getElementById("panelSub").textContent = selectedDate === todayISO() ? "Today" : "";

    var items = itemsForDate(selectedDate);

    /* timeline */
    var tl = document.getElementById("timeline");
    tl.innerHTML = "";
    tl.style.height = ((HOUR_END - HOUR_START + 1) * ROW_H) + "px";
    for (var h = HOUR_START; h <= HOUR_END; h++) {
      var row = document.createElement("div");
      row.className = "hour-row";
      var lbl = document.createElement("div");
      lbl.className = "hour-label";
      lbl.textContent = to12h(pad(h) + ":00");
      row.appendChild(lbl);
      (function (hour) {
        row.addEventListener("click", function () {
          openModal("activity", null, { date: selectedDate, time: pad(hour) + ":00" });
        });
      })(h);
      tl.appendChild(row);
    }
    var evWrap = document.createElement("div");
    evWrap.className = "timeline-events";
    tl.appendChild(evWrap);

    // simple overlap columns
    var evs = items.activities.map(function (a) {
      var sm = timeToMinutes(a.time) - HOUR_START * 60;
      var dur = a.duration || 60;
      return { a: a, start: sm, end: sm + dur };
    }).sort(function (x, y) { return x.start - y.start; });
    var columns = [];
    evs.forEach(function (ev) {
      var placed = false;
      for (var c = 0; c < columns.length; c++) {
        if (columns[c] <= ev.start) { columns[c] = ev.end; ev.col = c; placed = true; break; }
      }
      if (!placed) { ev.col = columns.length; columns.push(ev.end); }
    });
    var maxCol = Math.max(1, columns.length);
    evs.forEach(function (ev) {
      var el = document.createElement("div");
      el.className = "tl-event";
      var top = Math.max(0, ev.start) / 60 * ROW_H;
      var height = Math.max(20, (ev.end - ev.start) / 60 * ROW_H - 2);
      var widthPct = 100 / maxCol;
      el.style.top = top + "px";
      el.style.height = height + "px";
      el.style.left = (ev.col * widthPct) + "%";
      el.style.width = (widthPct - 2) + "%";
      el.innerHTML = '<strong>' + escapeHTML(ev.a.title) + '</strong><span class="time">' + to12h(ev.a.time) + '</span>';
      el.addEventListener("click", function (e) { e.stopPropagation(); openModal("activity", ev.a.id); });
      evWrap.appendChild(el);
    });

    /* goals */
    var goalList = document.getElementById("goalList");
    goalList.innerHTML = "";
    if (items.goals.length === 0) {
      goalList.innerHTML = '<div class="empty-note">No goals set for this day.</div>';
    }
    items.goals.forEach(function (g) {
      var row = document.createElement("div");
      row.className = "list-item goal";
      row.innerHTML = '<span class="diff">' + DIFF[g.difficulty].flames + '</span><span class="title">' + escapeHTML(g.title) + '</span>';
      row.addEventListener("click", function () { openModal("goal", g.id); });
      goalList.appendChild(row);
    });

    /* tasks */
    var taskList = document.getElementById("taskList");
    taskList.innerHTML = "";
    if (items.tasks.length === 0) {
      taskList.innerHTML = '<div class="empty-note">No tasks yet.</div>';
    }
    items.tasks.forEach(function (t) {
      var row = document.createElement("div");
      row.className = "list-item task";
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!t.done;
      cb.addEventListener("click", function (e) {
        e.stopPropagation();
        t.done = cb.checked;
        saveData();
        renderDayPanel();
        renderMonth();
        renderSidebar();
      });
      row.appendChild(cb);
      var timeSpan = document.createElement("span");
      timeSpan.style.fontFamily = "var(--font-mono)";
      timeSpan.style.fontSize = "0.7rem";
      timeSpan.style.color = "var(--text-3)";
      timeSpan.style.flexShrink = "0";
      timeSpan.textContent = t.time ? to12h(t.time) : "";
      row.appendChild(timeSpan);
      var titleSpan = document.createElement("span");
      titleSpan.className = "title" + (t.done ? " done" : "");
      titleSpan.textContent = t.title;
      row.appendChild(titleSpan);
      row.addEventListener("click", function () { openModal("task", t.id); });
      taskList.appendChild(row);
    });
  }

  function timeToMinutes(hhmm) {
    var p = hhmm.split(":");
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  document.getElementById("panelClose").addEventListener("click", closeDayPanel);
  document.getElementById("scrim").addEventListener("click", function () { closeDayPanel(); closeModal(); });

  /* ---------------- modal ---------------- */
  var overlay = document.getElementById("modalOverlay");
  var form = document.getElementById("modalForm");
  var fieldsWrap = document.getElementById("modalFields");

  function openModal(type, id, prefill) {
    editing = { type: type, id: id || null };
    document.getElementById("requiredHint").classList.remove("show");
    var record = null;
    if (id) {
      var listName = type === "activity" ? "activities" : type + "s";
      record = data[listName].find(function (r) { return r.id === id; });
    }
    var titleMap = { activity: "activity", goal: "goal", task: "task" };
    document.getElementById("modalTitle").textContent = (record ? "Edit " : "Add ") + titleMap[type];
    document.getElementById("deleteBtn").style.display = record ? "inline-flex" : "none";

    var dateVal = (record && record.date) || (prefill && prefill.date) || selectedDate || todayISO();
    fieldsWrap.innerHTML = "";

    if (type === "activity") {
      fieldsWrap.innerHTML =
        field("text", "act-title", "Title", record ? record.title : "", true) +
        '<div class="field-row">' +
          field("date", "act-date", "Date", dateVal, true) +
          field("time", "act-time", "Start time", (record && record.time) || (prefill && prefill.time) || "09:00", true) +
        '</div>' +
        field("time", "act-endtime", "End time (optional)", record && record.duration ? addMinutes((record.time), record.duration) : "") +
        fieldTextarea("act-notes", "Notes", record ? record.notes || "" : "");
    } else if (type === "goal") {
      fieldsWrap.innerHTML =
        field("text", "goal-title", "Title", record ? record.title : "", true) +
        field("date", "goal-date", "Date", dateVal, true) +
        '<div class="field"><label>Difficulty</label><div class="diff-picker" id="diffPicker"></div></div>';
      var picker = fieldsWrap.querySelector("#diffPicker");
      var currentDiff = record ? record.difficulty : 3;
      for (var lvl = 1; lvl <= 5; lvl++) {
        (function (lvl) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "diff-btn" + (lvl === currentDiff ? " active" : "");
          b.setAttribute("data-level", lvl);
          b.innerHTML = '<span class="flames">' + DIFF[lvl].flames + '</span><span class="lbl">' + DIFF[lvl].label + '</span>';
          b.addEventListener("click", function () {
            picker.querySelectorAll(".diff-btn").forEach(function (x) { x.classList.remove("active"); });
            b.classList.add("active");
            picker.setAttribute("data-selected", lvl);
          });
          picker.appendChild(b);
        })(lvl);
      }
      picker.setAttribute("data-selected", currentDiff);
    } else if (type === "task") {
      fieldsWrap.innerHTML =
        field("text", "task-title", "Title", record ? record.title : "", true) +
        '<div class="field-row">' +
          field("date", "task-date", "Date", dateVal, true) +
          field("time", "task-time", "Time (optional)", (record && record.time) || "") +
        '</div>';
    }

    overlay.classList.add("open");
    setTimeout(function () {
      var first = fieldsWrap.querySelector("input[type=text], input[type=date]");
      if (first) first.focus();
    }, 30);
  }

  function addMinutes(hhmm, mins) {
    var t = timeToMinutes(hhmm) + mins;
    t = ((t % 1440) + 1440) % 1440;
    return pad(Math.floor(t / 60)) + ":" + pad(t % 60);
  }

  function field(type, id, label, value, required) {
    return '<div class="field"><label for="' + id + '">' + label + (required ? "" : "") + '</label>' +
      '<input type="' + type + '" id="' + id + '" ' + (required ? "required" : "") + ' value="' + escapeHTML(value || "") + '"></div>';
  }
  function fieldTextarea(id, label, value) {
    return '<div class="field"><label for="' + id + '">' + label + '</label><textarea id="' + id + '">' + escapeHTML(value || "") + '</textarea></div>';
  }

  function closeModal() {
    overlay.classList.remove("open");
    editing = null;
  }

  document.getElementById("cancelBtn").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeModal(); closeDayPanel(); closeTimerSetup(); }
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var type = editing.type;
    var listName = type === "activity" ? "activities" : type + "s";

    if (type === "activity") {
      var title = document.getElementById("act-title").value.trim();
      var dateV = document.getElementById("act-date").value;
      var timeV = document.getElementById("act-time").value;
      if (!title || !dateV || !timeV) { showRequired(); return; }
      var endV = document.getElementById("act-endtime").value;
      var duration = 60;
      if (endV) {
        duration = timeToMinutes(endV) - timeToMinutes(timeV);
        if (duration <= 0) duration += 1440;
      }
      var notes = document.getElementById("act-notes").value.trim();
      if (editing.id) {
        var rec = data.activities.find(function (r) { return r.id === editing.id; });
        rec.title = title; rec.date = dateV; rec.time = timeV; rec.duration = duration; rec.notes = notes;
      } else {
        data.activities.push({ id: uid(), title: title, date: dateV, time: timeV, duration: duration, notes: notes });
      }
    } else if (type === "goal") {
      var gTitle = document.getElementById("goal-title").value.trim();
      var gDate = document.getElementById("goal-date").value;
      var picker = document.getElementById("diffPicker");
      var diff = parseInt(picker.getAttribute("data-selected"), 10) || 3;
      if (!gTitle || !gDate) { showRequired(); return; }
      if (editing.id) {
        var grec = data.goals.find(function (r) { return r.id === editing.id; });
        grec.title = gTitle; grec.date = gDate; grec.difficulty = diff;
      } else {
        data.goals.push({ id: uid(), title: gTitle, date: gDate, difficulty: diff });
      }
    } else if (type === "task") {
      var tTitle = document.getElementById("task-title").value.trim();
      var tDate = document.getElementById("task-date").value;
      var tTime = document.getElementById("task-time").value;
      if (!tTitle || !tDate) { showRequired(); return; }
      if (editing.id) {
        var trec = data.tasks.find(function (r) { return r.id === editing.id; });
        trec.title = tTitle; trec.date = tDate; trec.time = tTime;
      } else {
        data.tasks.push({ id: uid(), title: tTitle, date: tDate, time: tTime, done: false });
      }
    }

    saveData();
    closeModal();
    renderMonth();
    renderSidebar();
    if (selectedDate) renderDayPanel();
  });

  document.getElementById("deleteBtn").addEventListener("click", function () {
    if (!editing || !editing.id) return;
    var listName = editing.type === "activity" ? "activities" : editing.type + "s";
    data[listName] = data[listName].filter(function (r) { return r.id !== editing.id; });
    saveData();
    closeModal();
    renderMonth();
    renderSidebar();
    if (selectedDate) renderDayPanel();
  });

  function showRequired() {
    document.getElementById("requiredHint").classList.add("show");
  }

  /* ---------------- timer ---------------- */
  var timerOverlay = document.getElementById("timerOverlay");
  var timerWidget = document.getElementById("timerWidget");
  var twPhase = document.getElementById("twPhase");
  var twTime = document.getElementById("twTime");
  var twPauseBtn = document.getElementById("twPauseBtn");
  var timerState = null;

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function formatMMSS(totalSeconds) {
    totalSeconds = Math.max(0, totalSeconds);
    var m = Math.floor(totalSeconds / 60), s = totalSeconds % 60;
    return pad2(m) + ":" + pad2(s);
  }

  function playBeep() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var t0 = ctx.currentTime;
      for (var i = 0; i < 3; i++) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        var t = t0 + i * 0.5;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
      }
    } catch (e) {}
  }

  function openTimerSetup() {
    document.getElementById("timerMinutes").value = timerState ? Math.ceil((timerState.remaining || 0) / 60) : 25;
    timerOverlay.classList.add("open");
  }
  function closeTimerSetup() { timerOverlay.classList.remove("open"); }

  function startTimer(focusMin, breakMin) {
    timerState = { focusMin: focusMin, breakMin: breakMin, phase: "focus", paused: false, intervalId: null };
    timerWidget.classList.add("show");
    beginPhase("focus", focusMin * 60);
  }

  function beginPhase(phase, seconds) {
    timerState.phase = phase;
    timerState.remaining = seconds;
    timerState.endTime = Date.now() + seconds * 1000;
    timerState.paused = false;
    twPauseBtn.textContent = "⏸";
    twPhase.textContent = phase === "focus" ? "Focus" : "Break";
    timerWidget.classList.remove("ringing");
    twTime.textContent = formatMMSS(seconds);
    clearInterval(timerState.intervalId);
    timerState.intervalId = setInterval(tickTimer, 250);
  }

  function tickTimer() {
    if (!timerState || timerState.paused) return;
    var remaining = Math.round((timerState.endTime - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(timerState.intervalId);
      onPhaseEnd();
    } else {
      timerState.remaining = remaining;
      twTime.textContent = formatMMSS(remaining);
    }
  }

  function onPhaseEnd() {
    playBeep();
    timerWidget.classList.add("ringing");
    twTime.textContent = "00:00";
    if (timerState.phase === "focus" && timerState.breakMin > 0) {
      twPhase.textContent = "Focus done";
      setTimeout(function () {
        if (timerState) beginPhase("break", timerState.breakMin * 60);
      }, 1500);
    } else {
      twPhase.textContent = timerState.phase === "focus" ? "Focus done" : "Break done";
      setTimeout(stopTimer, 5000);
    }
  }

  function stopTimer() {
    if (timerState) clearInterval(timerState.intervalId);
    timerState = null;
    timerWidget.classList.remove("show", "ringing");
  }

  function togglePauseTimer() {
    if (!timerState) return;
    if (timerState.paused) {
      timerState.paused = false;
      timerState.endTime = Date.now() + timerState.remaining * 1000;
      twPauseBtn.textContent = "⏸";
    } else {
      timerState.paused = true;
      twPauseBtn.textContent = "▶";
    }
  }

  document.getElementById("timerBtn").addEventListener("click", openTimerSetup);
  document.getElementById("timerCancelBtn").addEventListener("click", closeTimerSetup);
  timerOverlay.addEventListener("click", function (e) { if (e.target === timerOverlay) closeTimerSetup(); });
  document.getElementById("timerStartBtn").addEventListener("click", function () {
    var mins = parseInt(document.getElementById("timerMinutes").value, 10);
    var breakMins = parseInt(document.getElementById("timerBreakMinutes").value, 10) || 0;
    if (!mins || mins <= 0) { document.getElementById("timerMinutes").focus(); return; }
    closeTimerSetup();
    startTimer(mins, breakMins);
  });
  twPauseBtn.addEventListener("click", togglePauseTimer);
  document.getElementById("twStopBtn").addEventListener("click", stopTimer);

  /* ---------------- header buttons ---------------- */
  document.getElementById("addActivityBtn").addEventListener("click", function () { openModal("activity", null, { date: selectedDate || todayISO() }); });
  document.getElementById("addGoalBtn").addEventListener("click", function () { openModal("goal", null, { date: selectedDate || todayISO() }); });
  document.getElementById("addTaskBtn").addEventListener("click", function () { openModal("task", null, { date: selectedDate || todayISO() }); });
  document.getElementById("panelAddActivity").addEventListener("click", function () { openModal("activity", null, { date: selectedDate }); });
  document.getElementById("panelAddGoal").addEventListener("click", function () { openModal("goal", null, { date: selectedDate }); });
  document.getElementById("panelAddTask").addEventListener("click", function () { openModal("task", null, { date: selectedDate }); });
  document.querySelectorAll(".add-inline").forEach(function (b) {
    b.addEventListener("click", function () { openModal(b.getAttribute("data-add"), null, { date: selectedDate }); });
  });

  document.getElementById("prevMonth").addEventListener("click", function () {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderMonth();
  });
  document.getElementById("nextMonth").addEventListener("click", function () {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderMonth();
  });
  document.getElementById("todayBtn").addEventListener("click", function () {
    var t = new Date();
    viewYear = t.getFullYear(); viewMonth = t.getMonth();
    renderMonth();
  });

  /* ---------------- init ---------------- */
  initTheme();
  renderMonth();
  renderSidebar();
})();
</script>
</body>
</html>
